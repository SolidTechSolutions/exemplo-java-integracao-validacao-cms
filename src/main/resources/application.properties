# EN:    SolidSign CAdES (CMS) signature validation example
#        Run: mvn spring-boot:run
#        Batch: POST http://localhost:8095/api/cms/validate/batch
#        Form:  POST http://localhost:8095/api/cms/validate/form
#        For DETACHED signatures also send originalFile field(s) in the form request.
#
# PT-BR: Exemplo de validação de assinatura CAdES (CMS)
#        Lote: POST http://localhost:8095/api/cms/validate/batch
#        Form: POST http://localhost:8095/api/cms/validate/form
#        Para assinaturas DETACHED, envie também o campo originalFile na requisição.

server.port=8095

solidsign.api.base-url=http://localhost:8080
solidsign.api.authorization=Bearer eyJ...

# Batch mode: directory containing .p7s signed files
solidsign.batch.input-path=C:/signed_cms
# For detached CMS, directory containing corresponding original files (same filenames without .p7s)
solidsign.batch.original-path=
solidsign.batch.output-path=C:/validation_results

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
